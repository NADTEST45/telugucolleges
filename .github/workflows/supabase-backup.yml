name: Supabase weekly backup

# Why this exists:
#   We're on Supabase free tier — no point-in-time recovery, no automated
#   snapshots. A misclick on the dashboard or a bad migration can wipe the
#   project. This workflow runs a weekly pg_dump, encrypts it, and commits the
#   ciphertext to the `supabase-backups` branch so we always have at least the
#   most recent 8 weeks of restore points without paying for Pro.
#
# SECURITY MODEL — read before changing anything here:
#   * This repository is PUBLIC. Every branch (including supabase-backups) is
#     world-readable. This branch is NOT private — treat anything pushed here
#     as published to the entire internet.
#   * Because of that, dumps are encrypted with GnuPG (AES256, symmetric)
#     BEFORE they ever touch git. The branch only ever holds opaque ciphertext
#     (`.sql.gz.gpg`); the plaintext SQL never leaves the runner. The
#     decryption passphrase lives only in the BACKUP_PASSPHRASE secret.
#   * The `auth` schema is intentionally NOT dumped. auth.users holds bcrypt
#     password hashes, every user/admin email, and recovery tokens — that data
#     must never sit in git, encrypted or not. We back up ONLY the `public`
#     schema (the app's own tables). Auth users can be re-provisioned via
#     Supabase, so they are recoverable without a git backup.
#   * Stronger long-term option: push these encrypted dumps to a PRIVATE
#     destination (a private bucket such as S3/R2, or a private repo) instead
#     of a branch in this public repo, so even the ciphertext isn't public.
#
#   To restore:
#     1. git checkout supabase-backups
#     2. gpg --batch --decrypt --passphrase "<BACKUP_PASSPHRASE>" \
#          dumps/supabase-<date>.sql.gz.gpg > supabase-<date>.sql.gz
#     3. gunzip supabase-<date>.sql.gz
#     4. psql "<connection-string>" -f supabase-<date>.sql  (fresh project)

on:
  schedule:
    # Every Monday at 03:00 UTC (08:30 IST). Off-peak for the site.
    - cron: "0 3 * * 1"
  workflow_dispatch: # allow manual run from the Actions tab

permissions:
  contents: write # needed to push to the backup branch

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: supabase-backups
          fetch-depth: 1
          persist-credentials: true
        # If the branch doesn't exist yet, the next step creates it.
        continue-on-error: true

      - name: Ensure on supabase-backups branch
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          if ! git rev-parse --verify supabase-backups >/dev/null 2>&1; then
            git checkout --orphan supabase-backups
            git rm -rf . >/dev/null 2>&1 || true
            echo "# Supabase weekly backups" > README.md
            echo "Auto-generated by .github/workflows/supabase-backup.yml" >> README.md
            git add README.md
            git commit -m "init backups branch"
          else
            git checkout supabase-backups
          fi

      - name: Install postgres-17 client
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt/ $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Run pg_dump
        env:
          # Set this secret in GitHub: Settings → Secrets and variables →
          # Actions → New secret. Format:
          #   postgres://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:6543/postgres
          # Get it from Supabase: Project Settings → Database → Connection
          # string → URI (Transaction pooler, port 6543).
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          # Symmetric passphrase used to AES256-encrypt the dump before it is
          # committed. Set it as a secret alongside SUPABASE_DB_URL. Losing it
          # means the backups are unrecoverable, so store it somewhere safe too.
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set"
            exit 1
          fi
          # Fail CLOSED: without the passphrase we'd produce a plaintext dump,
          # which must NEVER be committed to this public repo. Abort instead.
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::BACKUP_PASSPHRASE secret not set"
            exit 1
          fi
          mkdir -p dumps
          STAMP=$(date -u +%Y-%m-%d)
          # Dump ONLY the public schema. The auth schema (auth.users: password
          # hashes, emails, recovery tokens) is deliberately excluded — it must
          # never be stored in git. Pipe straight into gpg so the plaintext SQL
          # is never written to disk; only the AES256 ciphertext is.
          pg_dump \
            --no-owner \
            --no-privileges \
            --schema=public \
            "$SUPABASE_DB_URL" \
            | gzip -9 \
            | gpg --batch --symmetric --cipher-algo AES256 \
                  --passphrase "$BACKUP_PASSPHRASE" \
                  -o "dumps/supabase-${STAMP}.sql.gz.gpg"
          ls -lh dumps/

      - name: Prune dumps older than 8 weeks
        run: |
          find dumps/ -name "supabase-*.sql.gz.gpg" -mtime +56 -delete || true

      - name: Commit dump
        run: |
          STAMP=$(date -u +%Y-%m-%d)
          git add dumps/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "backup: ${STAMP}"
          git push origin supabase-backups
